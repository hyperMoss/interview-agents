name: Verify

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    name: Build, database and Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CI: 'true'
      RUN_INTEGRATION: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '22'
          package-manager-cache: false

      - name: Set up pnpm from packageManager
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86

      - name: Install locked dependencies and required runtimes
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          pnpm runtime:setup
          node node_modules/esbuild/install.js
          pnpm exec playwright install --with-deps chrome

      - name: Prepare disposable fixture services
        run: |
          mkdir -p .ci-output
          cp .env.example .env
          docker compose -p interview-agents-ci -f infra/compose.yaml up -d --wait
          docker compose -p interview-agents-ci-tests -f infra/compose.test.yaml up -d --wait

      - name: Build and validate the factory skill
        run: pnpm build

      - name: Run all unit and isolated database tests
        run: pnpm exec vitest run --reporter=default --reporter=json --outputFile=.ci-output/test-results.json

      - name: Start the application and wait for healthy services
        run: |
          pnpm dev > .ci-output/application.log 2>&1 &
          timeout 120 bash <<'WAIT'
          until curl --fail --silent --max-time 2 http://localhost:3000/api/v1/health > /dev/null \
            && curl --fail --silent --max-time 2 http://localhost:4111/health > /dev/null \
            && curl --fail --silent --max-time 2 http://localhost:5173/ > /dev/null; do
            sleep 2
          done
          WAIT
          pnpm run doctor

      - name: Run Chrome desktop and mobile acceptance
        env:
          PLAYWRIGHT_JSON_OUTPUT_FILE: .ci-output/browser-results.json
        run: pnpm exec playwright test --reporter=line,json

      - name: Save verification results and failure evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            .ci-output/*.json
            .ci-output/application.log
            test-results/
            docs/evidence/screenshots/
          include-hidden-files: true

      - name: Remove disposable databases
        if: ${{ always() }}
        run: |
          docker compose -p interview-agents-ci-tests -f infra/compose.test.yaml down --volumes
          docker compose -p interview-agents-ci -f infra/compose.yaml down --volumes
