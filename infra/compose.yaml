name: interview-agents
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: interview
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-admin-password
    ports: ["127.0.0.1:55439:5432"]
    volumes:
      - interview-pg:/var/lib/postgresql/data
      - ./migrations/001-init.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./migrations/002-model-connections.sql:/docker-entrypoint-initdb.d/02-models.sql:ro
      - ./migrations/003-interview-extension.sql:/docker-entrypoint-initdb.d/03-extension.sql:ro
      - ./init-dev.sql:/docker-entrypoint-initdb.d/04-users.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d interview"]
      interval: 3s
      retries: 20
  redis:
    image: redis:7.4.6-alpine
    ports: ["127.0.0.1:56389:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      retries: 20
volumes:
  interview-pg:
